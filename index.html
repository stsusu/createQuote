<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>맞춤 쿠키커터 견적</title>
<style>
:root{--ink:#20232b;--muted:#747987;--line:#e5e7ed;--paper:#fff;--bg:#f5f6f9;--accent:#e84b80;--accent-soft:#fff0f5;--blue:#5565d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:auto;padding:26px 18px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}.top h1{font-size:25px;line-height:1.25;margin:0 0 7px;letter-spacing:-.04em}.top p{margin:0;color:var(--muted);font-size:14px}.pill{white-space:nowrap;border:1px solid #f3cbd8;background:#fff7fa;color:#a52d59;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #18204408}.section-title{font-weight:750;font-size:16px;margin:0 0 12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}.btn-primary{background:var(--ink);color:white}.btn-accent{background:var(--accent);color:white}.btn-soft{background:#f0f1f5;color:#333846}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.help{font-size:12px;color:var(--muted);margin:10px 0 0}
.designs{display:grid;grid-template-columns:1fr 1fr;gap:14px}.design{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}.design-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.design-head input{font-weight:700;border:0;background:transparent;font-size:15px;padding:5px 2px;min-width:0;flex:1}.remove{width:34px;height:34px;border:0;border-radius:9px;background:#f4f4f6;color:#777;cursor:pointer;font-size:19px}.crop-wrap{position:relative;background:#fafafd;border:1px solid #eceef3;border-radius:12px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:150px;touch-action:none}.crop-wrap canvas{display:block;max-width:100%;max-height:300px;width:auto;height:auto;touch-action:none;cursor:crosshair}.crop-badge{position:absolute;left:8px;top:8px;background:#20232bbd;color:white;border-radius:7px;padding:4px 7px;font-size:11px;pointer-events:none}.dimensions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.input-suffix{position:relative}.input-suffix input{width:100%;height:43px;border:1px solid #dfe2e9;border-radius:10px;padding:0 40px 0 11px;font:inherit;font-weight:650;outline:none}.input-suffix input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #5565d91a}.suffix{position:absolute;right:12px;top:10px;color:var(--muted);font-size:13px;pointer-events:none}.ratio-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:#626777}.ratio-row label{display:flex;align-items:center;gap:6px;cursor:pointer}.ratio-row input{accent-color:var(--blue)}.crop-reset{font-size:12px;border:0;background:transparent;color:var(--blue);cursor:pointer;padding:4px}.quote-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #f0f0f2;margin-top:11px;padding-top:10px;font-size:13px;color:var(--muted)}.quote-row strong{color:var(--ink);font-size:17px}.total{display:flex;justify-content:space-between;align-items:center;gap:14px}.total-label{font-size:14px;color:var(--muted)}.total-value{font-size:29px;font-weight:850;color:var(--accent);letter-spacing:-.04em}.formula{font-size:12px;color:#777;margin-top:3px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.result{margin-top:18px;text-align:center}.result img{width:100%;max-width:680px;border:1px solid var(--line);border-radius:12px;background:white}.result p{font-size:12px;color:var(--muted)}
@media(max-width:680px){.wrap{padding:20px 12px 40px}.top h1{font-size:22px}.panel{padding:14px;border-radius:15px}.designs{grid-template-columns:1fr}.design{padding:12px}.crop-wrap canvas{max-height:260px}.total-value{font-size:25px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div><h1>맞춤 쿠키커터 견적</h1><p>이미지에서 제작 범위를 선택하고 치수를 입력해 견적 이미지를 만드세요.</p></div><span class="pill">AI 없이 기기에서 처리</span></header>
  <section class="panel">
    <h2 class="section-title">견적 정보</h2>
    <div class="dimensions">
      <div class="field"><label for="quoteTitle">견적서 제목</label><div class="input-suffix"><input id="quoteTitle" value="맞춤 쿠키커터 견적서" maxlength="40"></div></div>
      <div class="field"><label for="quoteDate">날짜</label><div class="input-suffix"><input id="quoteDate" type="date"></div></div>
    </div>
    <p class="help">가격 공식: (가로 올림 + 세로 올림 − 1) × 1,000원</p>
  </section>
  <section class="panel">
    <h2 class="section-title">디자인 목록</h2>
    <div class="toolbar"><button class="btn btn-primary" id="addBtn" type="button">＋ 디자인 추가</button><input id="fileInput" class="hidden" type="file" accept="image/*" multiple></div>
    <p class="help">이미지를 추가한 뒤 미리보기에서 손가락이나 마우스로 제작할 부분을 드래그해 지정하세요. 가로 또는 세로 한쪽만 입력하면 선택 영역 비율에 맞춰 나머지 치수를 계산합니다.</p>
  </section>
  <div id="designs" class="designs" aria-live="polite"></div>
  <section class="panel" id="summaryPanel">
    <div class="total"><div><div class="total-label">총 견적 금액</div><div class="formula" id="countLabel">디자인 0개</div></div><div class="total-value" id="totalValue">0원</div></div>
    <div class="actions"><button class="btn btn-accent" id="makeBtn" type="button" disabled>견적 이미지 만들기</button><button class="btn btn-soft" id="clearBtn" type="button">전체 초기화</button></div>
    <div id="result" class="result hidden"><img id="resultImg" alt="생성된 견적 이미지"><p>이미지를 길게 눌러 저장하거나 아래 버튼으로 다운로드하세요.</p><button class="btn btn-primary" id="downloadBtn" type="button">PNG 다운로드</button></div>
  </section>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s), designsEl=$('#designs'), fileInput=$('#fileInput');
  const items=[]; let nextId=1;
  const date=$('#quoteDate'); date.value=new Date().toLocaleDateString('en-CA');
  $('#addBtn').addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change', e=>{[...e.target.files].forEach(addFile);fileInput.value='';});
  $('#clearBtn').addEventListener('click',()=>{items.splice(0).forEach(x=>URL.revokeObjectURL(x.url));designsEl.innerHTML='';updateTotal();$('#result').classList.add('hidden');});
  $('#makeBtn').addEventListener('click',makeQuote);
  $('#downloadBtn').addEventListener('click',()=>{const a=document.createElement('a');a.href=$('#resultImg').src;a.download='맞춤쿠키커터_견적.png';a.click();});
  $('#quoteTitle').addEventListener('input',()=>{if(!$('#result').classList.contains('hidden'))makeQuote();});
  $('#quoteDate').addEventListener('change',()=>{if(!$('#result').classList.contains('hidden'))makeQuote();});

  function addFile(file){if(!file.type.startsWith('image/'))return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const it={id:nextId++,file,url,img,name:file.name.replace(/\.[^.]+$/,''),crop:null,w:'',h:'',locked:true,canvas:null,drag:null};it.crop=defaultQuad(img);items.push(it);renderItem(it);updateTotal();};img.src=url;}
  function renderItem(it){
    const card=document.createElement('article');card.className='design';card.dataset.id=it.id;
    card.innerHTML=`<div class="design-head"><input aria-label="디자인 이름" value="${esc(it.name)}" maxlength="32"><button class="remove" title="삭제" aria-label="디자인 삭제">×</button></div><div class="crop-wrap"><canvas></canvas><span class="crop-badge">네 모서리 점을 끌어 제작 영역을 맞추세요</span></div><div class="dimensions"><div class="field"><label>가로</label><div class="input-suffix"><input class="width" inputmode="decimal" type="number" min="0.1" step="0.1" placeholder="cm"><span class="suffix">cm</span></div></div><div class="field"><label>세로</label><div class="input-suffix"><input class="height" inputmode="decimal" type="number" min="0.1" step="0.1" placeholder="cm"><span class="suffix">cm</span></div></div></div><div class="ratio-row"><label><input class="lock" type="checkbox" checked> 선택 영역 비율 유지</label><button class="crop-reset" type="button">영역 초기화</button></div><p class="help" style="margin:5px 0 0">선택 안쪽을 끌면 영역 전체가 이동합니다.</p><div class="quote-row"><span class="sizeLabel">치수를 입력하세요</span><strong class="price">—</strong></div>`;
    designsEl.appendChild(card);it.card=card;it.canvas=card.querySelector('canvas');it.widthInput=card.querySelector('.width');it.heightInput=card.querySelector('.height');it.lockInput=card.querySelector('.lock');
    card.querySelector('.design-head input').addEventListener('input',e=>{it.name=e.target.value;refreshQuoteIfVisible();});
    card.querySelector('.remove').addEventListener('click',()=>{const idx=items.indexOf(it);if(idx>=0)items.splice(idx,1);URL.revokeObjectURL(it.url);card.remove();updateTotal();refreshQuoteIfVisible();});
    card.querySelector('.crop-reset').addEventListener('click',()=>{it.crop=defaultQuad(it.img);drawCrop(it);syncRatio(it,'width');});
    it.lockInput.addEventListener('change',()=>{it.locked=it.lockInput.checked;});
    it.widthInput.addEventListener('input',()=>dimensionChanged(it,'width'));
    it.heightInput.addEventListener('input',()=>dimensionChanged(it,'height'));
    const c=it.canvas;c.width=it.img.naturalWidth;c.height=it.img.naturalHeight;drawCrop(it);
    c.addEventListener('pointerdown',e=>{const p=point(c,e),near=nearestCorner(it.crop.points,p,cornerRadius(c));if(near>=0)it.drag={type:'corner',index:near};else if(insidePolygon(it.crop.points,p)){it.drag={type:'move',start:p,points:it.crop.points.map(q=>({...q}))};}else return;c.setPointerCapture(e.pointerId);e.preventDefault();});
    c.addEventListener('pointermove',e=>{if(!it.drag)return;const p=point(c,e);if(it.drag.type==='corner'){const next=it.crop.points.map(q=>({...q}));next[it.drag.index]=p;if(isConvex(next))it.crop.points=next;}else{const dx=p.x-it.drag.start.x,dy=p.y-it.drag.start.y,pts=it.drag.points;const minX=Math.min(...pts.map(q=>q.x)),maxX=Math.max(...pts.map(q=>q.x)),minY=Math.min(...pts.map(q=>q.y)),maxY=Math.max(...pts.map(q=>q.y));const sx=clamp(dx,-minX,c.width-maxX),sy=clamp(dy,-minY,c.height-maxY);it.crop.points=pts.map(q=>({x:q.x+sx,y:q.y+sy}));}drawCrop(it);});
    const end=()=>{if(it.drag){it.drag=null;drawCrop(it);syncRatio(it,'width');}};
    c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  }
  function point(canvas,e){const r=canvas.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*canvas.width/r.width,0,canvas.width),y:clamp((e.clientY-r.top)*canvas.height/r.height,0,canvas.height)}}
  function defaultQuad(img){const x=img.naturalWidth*.04,y=img.naturalHeight*.04,w=img.naturalWidth*.92,h=img.naturalHeight*.92;return{points:[{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h}]};}
  function bounds(crop){const xs=crop.points.map(p=>p.x),ys=crop.points.map(p=>p.y),x=Math.min(...xs),y=Math.min(...ys),right=Math.max(...xs),bottom=Math.max(...ys);return{x,y,w:right-x,h:bottom-y};}
  function cornerRadius(canvas){const r=canvas.getBoundingClientRect();return 26*canvas.width/r.width;}
  function nearestCorner(points,p,limit){let best=-1,dist=Infinity;points.forEach((q,i)=>{const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<dist){dist=d;best=i;}});return dist<=limit?best:-1;}
  function insidePolygon(poly,p){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))inside=!inside;}return inside;}
  function isConvex(poly){let sign=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],c=poly[(i+2)%poly.length],cross=(b.x-a.x)*(c.y-b.y)-(b.y-a.y)*(c.x-b.x);if(Math.abs(cross)<1)return false;const next=Math.sign(cross);if(sign&&next!==sign)return false;sign=next;}return true;}
  function drawCrop(it){const c=it.canvas,ctx=c.getContext('2d'),pts=it.crop.points;ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(it.img,0,0);ctx.fillStyle='rgba(20,24,36,.48)';ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.clip();ctx.drawImage(it.img,0,0);ctx.restore();ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.strokeStyle='#f0447c';ctx.lineWidth=Math.max(3,c.width/260);ctx.stroke();pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,Math.max(11,c.width/95),0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=Math.max(3,c.width/280);ctx.strokeStyle='#e84b80';ctx.stroke();});}
  function cropAspect(it){const b=bounds(it.crop);return b.w/b.h;}
  function makeCropCanvas(it){const b=bounds(it.crop),out=document.createElement('canvas'),w=Math.max(1,Math.ceil(b.w)),h=Math.max(1,Math.ceil(b.h)),ctx=(out.width=w,out.height=h,out.getContext('2d'));ctx.save();ctx.beginPath();it.crop.points.forEach((p,i)=>i?ctx.lineTo(p.x-b.x,p.y-b.y):ctx.moveTo(p.x-b.x,p.y-b.y));ctx.closePath();ctx.clip();ctx.drawImage(it.img,-b.x,-b.y);ctx.restore();return out;}
  function dimensionChanged(it,which){it.locked=it.lockInput.checked;if(it.locked){const val=parseFloat(which==='width'?it.widthInput.value:it.heightInput.value);if(Number.isFinite(val)&&val>0){const ratio=cropAspect(it);if(which==='width')it.heightInput.value=fmt(val/ratio);else it.widthInput.value=fmt(val*ratio);}}updateTotal();refreshQuoteIfVisible();}
  function syncRatio(it,from){if(!it.lockInput.checked)return;const r=cropAspect(it);if(from==='width'&&parseFloat(it.widthInput.value)>0)it.heightInput.value=fmt(parseFloat(it.widthInput.value)/r);else if(from==='height'&&parseFloat(it.heightInput.value)>0)it.widthInput.value=fmt(parseFloat(it.heightInput.value)*r);updateTotal();refreshQuoteIfVisible();}
  function dims(it){const w=parseFloat(it.widthInput.value),h=parseFloat(it.heightInput.value);return Number.isFinite(w)&&Number.isFinite(h)&&w>0&&h>0?{w,h}:null;}
  function cost(it){const d=dims(it);return d?Math.max(0,Math.ceil(d.w-1e-9)+Math.ceil(d.h-1e-9)-1)*1000:null;}
  function updateTotal(){let total=0,valid=0;for(const it of items){const d=dims(it),p=cost(it);it.card.querySelector('.price').textContent=p===null?'—':won(p);it.card.querySelector('.sizeLabel').textContent=d?`${fmt(d.w)} × ${fmt(d.h)}cm`:'치수를 입력하세요';if(p!==null){total+=p;valid++;}}$('#totalValue').textContent=won(total);$('#countLabel').textContent=`디자인 ${items.length}개 · 견적 산출 ${valid}개`;$('#makeBtn').disabled=!items.length||valid!==items.length;}
  function refreshQuoteIfVisible(){if(!$('#result').classList.contains('hidden')&&items.length&&items.every(it=>cost(it)!==null))makeQuote();}
  async function makeQuote(){if(!items.length||items.some(it=>cost(it)===null))return;const scale=2,W=1200,pad=54,gap=24,cols=2,cardW=(W-pad*2-gap)/2,cardH=430,rows=Math.ceil(items.length/2),headerH=190,footerH=190,H=headerH+rows*cardH+(rows-1)*gap+footerH+pad;
    const cn=document.createElement('canvas');cn.width=W*scale;cn.height=H*scale;const ctx=cn.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#f8f8fa';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#252832';ctx.font='700 43px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.textAlign='left';ctx.fillText($('#quoteTitle').value.trim()||'맞춤 쿠키커터 견적서',pad,76);
    ctx.fillStyle='#777b86';ctx.font='20px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.fillText($('#quoteDate').value||'',pad,115);
    ctx.strokeStyle='#e4e5ea';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,145);ctx.lineTo(W-pad,145);ctx.stroke();
    for(let i=0;i<items.length;i++){const it=items[i],col=i%2,row=Math.floor(i/2),x=pad+col*(cardW+gap),y=headerH+row*(cardH+gap),d=dims(it),p=cost(it);roundRect(ctx,x,y,cardW,cardH,18,'#fff','#e7e8ed');
      const title=(it.name||`디자인 ${i+1}`).slice(0,23);ctx.fillStyle='#333642';ctx.font='700 20px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.textAlign='left';ctx.fillText(title,x+20,y+34);
      const bx=x+20,by=y+54,bw=cardW-40,bh=270;ctx.fillStyle='#fafafd';roundRect(ctx,bx,by,bw,bh,12,'#fafafd','#f0f0f3');
      const cropImage=makeCropCanvas(it),padImg=20,fit=Math.min((bw-padImg*2)/cropImage.width,(bh-padImg*2)/cropImage.height),dw=cropImage.width*fit,dh=cropImage.height*fit;ctx.drawImage(cropImage,bx+(bw-dw)/2,by+(bh-dh)/2,dw,dh);
      ctx.fillStyle='#686c77';ctx.font='18px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.fillText(`${fmt(d.w)} × ${fmt(d.h)}cm`,x+20,y+356);
      ctx.fillStyle='#e84b80';ctx.font='700 25px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.textAlign='right';ctx.fillText(won(p),x+cardW-20,y+358);
    }
    const total=items.reduce((s,it)=>s+cost(it),0),fy=headerH+rows*cardH+(rows-1)*gap+28;roundRect(ctx,pad,fy,W-pad*2,112,18,'#fff0f5','#f7d5e0');ctx.fillStyle='#6a3548';ctx.textAlign='left';ctx.font='600 22px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.fillText(`총 ${items.length}개 디자인`,pad+26,fy+43);ctx.fillStyle='#df3d73';ctx.textAlign='right';ctx.font='800 39px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.fillText(`총 견적 ${won(total)}`,W-pad-26,fy+73);
    ctx.fillStyle='#898c95';ctx.textAlign='center';ctx.font='15px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';ctx.fillText('가격 기준: (가로 올림 + 세로 올림 − 1) × 1,000원',W/2,fy+144);
    const blob=await new Promise(resolve=>cn.toBlob(resolve,'image/png'));if(!blob)return;$('#resultImg').src=URL.createObjectURL(blob);$('#result').classList.remove('hidden');$('#result').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  function roundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
  function fmt(n){return (Math.round(n*10)/10).toFixed(1).replace(/\.0$/,'');}
  function won(n){return `${Math.round(n).toLocaleString('ko-KR')}원`;}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
})();
</script>
</body>
</html>
